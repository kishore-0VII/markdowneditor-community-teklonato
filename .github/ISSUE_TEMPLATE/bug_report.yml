
name: "Bug Report"
description: Report something that isn't working correctly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue!
        Please don't include private documents,
        passwords, or sensitive information.

  - type: dropdown
    id: area
    attributes:
      label: Affected feature
      options:
        - Write editor
        - Source editor
        - Split view
        - File import
        - Markdown export
        - PDF export
        - Word export
        - Tables
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the editor
        2. Select...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 131 / Windows 11

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or sample Markdown
      description: Use non-sensitive sample content only.
